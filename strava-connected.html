<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strava Connected | SMARTCoach</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#eef4fb}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#fff;border:1px solid #d7e0ec;border-radius:8px;box-shadow:0 16px 40px rgba(15,23,42,.12);padding:28px}
    .mark{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#dcfce7;color:#166534;font-weight:900;font-size:28px;margin-bottom:18px}
    h1{font-size:26px;line-height:1.15;margin:0 0 10px}
    p{font-size:16px;line-height:1.5;margin:0 0 14px;color:#475569}
    .note{font-size:14px;color:#64748b}
  </style>
</head>
<body>
  <main>
    <div class="mark">✓</div>
    <h1>Strava is connected.</h1>
    <p id="message">Your coach can now load your recent Strava activities into SMART Trak.</p>
    <p class="note">You can close this tab and return to Strava or SMARTCoach.</p>
  </main>
  <script>
    (function(){
      try{
        var params=new URLSearchParams(window.location.search||'');
        var athlete=(params.get('athlete')||'').trim();
        if(athlete){
          document.getElementById('message').textContent=athlete+"'s Strava account is connected. The coach can now load recent activities into SMART Trak.";
        }
        if(params.get('strava')==='error'){
          document.querySelector('.mark').textContent='!';
          document.querySelector('.mark').style.background='#fee2e2';
          document.querySelector('.mark').style.color='#991b1b';
          document.querySelector('h1').textContent='Strava did not connect.';
          document.getElementById('message').textContent=params.get('stravaMessage')||'Please ask your coach for a new Strava connection link.';
        }
      }catch(error){}
    })();
  </script>
</body>
</html>
