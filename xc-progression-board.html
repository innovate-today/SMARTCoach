<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMART Trak XC Progression</title>
<style>
:root{--blue:#2b4fcc;--ink:#111827;--muted:#52627a;--line:#d6dfec;--bg:#eef3f9;--panel:#fff;--good:#08783c;--warn:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.page{max-width:1480px;margin:0 auto;padding:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;box-shadow:0 10px 24px rgba(15,23,42,.08)}.topactions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.sharestatus{font-size:13px;font-weight:900;color:#08783c}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;object-fit:contain}
h1{font-size:26px;margin:0;line-height:1.05}.sub{font-size:14px;color:var(--muted);margin-top:4px}.updated{display:inline-flex;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:#f8fbff;padding:6px 10px;font-size:13px;font-weight:800;color:#334155}
.controls{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr auto;gap:10px;margin-bottom:14px}.meetpick{position:relative}.meetpick button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);font-weight:500}.meetmenu{position:absolute;z-index:5;top:calc(100% + 6px);left:0;right:0;max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 28px rgba(15,23,42,.16);padding:8px}.meetmenu[hidden]{display:none}.meetmenu label{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:13px;cursor:pointer}.meetmenu label:hover{background:#eef3f9}.meetmenu input{width:auto;margin:0}input,select{border:1px solid var(--line);border-radius:8px;background:#fff;color:#111827;font:14px inherit;padding:10px 12px}button{border:0;border-radius:8px;background:#dde3ed;color:#172033;font:800 14px inherit;padding:10px 13px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px}.card b{display:block;font-size:24px}.card span{font-size:13px;color:#52627a}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}.panelhead h2{font-size:18px;margin:0}.status{font-size:13px;font-weight:900;color:var(--muted)}
.tablewrap{overflow:auto}.progression{width:max-content;min-width:100%;border-collapse:collapse}.progression th,.progression td{border:1px solid #253047;padding:3px 5px;text-align:center;vertical-align:middle;font-size:12px;min-width:54px;white-space:nowrap}.progression th:first-child,.progression td.name{min-width:160px;width:160px;max-width:160px}.progression th{background:#f8fbff;color:#111827;font-weight:900}.progression .section th{background:#f8fbff;color:#111827;text-align:center;font-size:13px}.progression .racehead{background:#dbeafe;color:#173891;font-size:13px;white-space:normal}.progression .racehead.alt{background:#fef3c7;color:#b45309}.progression .datehead{background:#f8fafc;color:#52627a;font-size:12px}.progression .name{text-align:left;font-weight:900;color:#111827;background:#fff;white-space:normal}.progression .final{font-weight:900}.progression .good{background:#dcfce7;color:#065f46;font-weight:900}.progression .warn{background:#fee2e2;color:#991b1b;font-weight:900}.progression .neutral{background:#f8fafc;color:#334155;font-weight:900}.progression .dnr{background:#fef9c3;color:#854d0e;font-weight:900}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.page{padding:12px 10px}.top{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr}.progression{min-width:640px}}
</style>
</head>
<body>
<main class="page">
  <section class="top">
    <div class="brand">
      <img id="logo" alt="SMART Trak">
      <div>
        <h1 id="boardTitle">SMART Trak</h1>
        <div id="subtitle" class="sub">Athlete progression by meet. Athletes down the left. Selected races across the top.</div>
        <div id="lastUpdated" class="updated">Loading...</div>
      </div>
    </div>
    <div class="topactions"><span id="shareStatus" class="sharestatus"></span><button id="shareViewBtn" type="button">Share View</button><button id="refreshBtn" type="button">Refresh</button></div>
  </section>
  <section class="controls">
    <input id="search" type="search" placeholder="Search athlete, meet, or division" autocomplete="off">
    <div class="meetpick"><button id="meetPickerBtn" type="button" aria-expanded="false">All Meets</button><div id="meetPickerPanel" class="meetmenu" hidden></div></div>
    <select id="eventSelect" aria-label="Distance"><option value="">All distances</option></select>
    <select id="genderSelect" aria-label="Gender"><option value="">All genders</option><option value="boy">Boys</option><option value="girl">Girls</option></select>
    <select id="gradeSelect" aria-label="Grade"><option value="">All grades</option></select>
    <button id="clearBtn" type="button">Clear</button>
  </section>
  <section class="cards">
    <div class="card"><b id="resultCount">--</b><span>Results</span></div>
    <div class="card"><b id="athleteCount">--</b><span>Athletes</span></div>
    <div class="card"><b id="meetCount">--</b><span>Meets</span></div>
    <div class="card"><b id="bestCount">--</b><span>PB / SB</span></div>
  </section>
  <section class="panel">
    <div class="panelhead"><h2>Progression Grid</h2><span id="gridStatus" class="status">Loading...</span></div>
    <div id="gridWrap" class="tablewrap"><div class="empty">Loading progression...</div></div>
  </section>
</main>
<script>
var allRows=[],filters={},options={},settings={},selectedMeetNames=[];
var els={logo:document.getElementById('logo'),boardTitle:document.getElementById('boardTitle'),subtitle:document.getElementById('subtitle'),lastUpdated:document.getElementById('lastUpdated'),shareStatus:document.getElementById('shareStatus'),shareViewBtn:document.getElementById('shareViewBtn'),refreshBtn:document.getElementById('refreshBtn'),search:document.getElementById('search'),meetPickerBtn:document.getElementById('meetPickerBtn'),meetPickerPanel:document.getElementById('meetPickerPanel'),eventSelect:document.getElementById('eventSelect'),genderSelect:document.getElementById('genderSelect'),gradeSelect:document.getElementById('gradeSelect'),clearBtn:document.getElementById('clearBtn'),resultCount:document.getElementById('resultCount'),athleteCount:document.getElementById('athleteCount'),meetCount:document.getElementById('meetCount'),bestCount:document.getElementById('bestCount'),gridStatus:document.getElementById('gridStatus'),gridWrap:document.getElementById('gridWrap')};
function params(){return new URLSearchParams(location.search||'')}
function decodeCompactShareKey(key){key=String(key||'').trim().replace(/-/g,'+').replace(/_/g,'/');while(key.length%4)key+='=';return JSON.parse(atob(key))}
function compactShareParams(){var p=params();var key=(p.get('k')||'').trim();if(!key)return p;try{var json=decodeCompactShareKey(key);if(json.a&&!p.get('account'))p.set('account',json.a);if(json.t&&!p.get('token'))p.set('token',json.t);if(json.y&&!p.get('seasonYear'))p.set('seasonYear',json.y);if(json.m&&!p.get('meet'))p.set('meet',json.m);if(json.e&&!p.get('event'))p.set('event',json.e);if(json.g&&!p.get('gender'))p.set('gender',json.g);if(json.gr&&!p.get('grade'))p.set('grade',json.gr)}catch(error){}return p}
function accountKey(){return(compactShareParams().get('account')||'default').trim()||'default'}
function token(){return(compactShareParams().get('token')||'').trim()}
function apiUrl(){var p=compactShareParams();p.delete('k');p.set('account',accountKey());p.set('token',token());p.set('meet','__all__');p.delete('event');p.delete('gender');p.delete('grade');p.set('v',Date.now());return'/api/smart-trak/xc-progression-board?'+p.toString()}
function boardCacheKey(){var p=compactShareParams();return['smartcoach-xc-progression-board',accountKey(),p.get('seasonYear')||''].join('|')}
function readCachedBoard(){try{var raw=localStorage.getItem(boardCacheKey());return raw?JSON.parse(raw):null}catch(error){return null}}
function writeCachedBoard(data){try{if(data&&Array.isArray(data.rows)&&data.rows.length)localStorage.setItem(boardCacheKey(),JSON.stringify(data))}catch(error){}}
function hasBoardRows(data){return!!(data&&Array.isArray(data.rows)&&data.rows.length)}
function esc(value){return String(value||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function jsonResult(res){return res.json().catch(function(){return{}}).then(function(data){if(!res.ok)throw new Error(data.error||'Request failed.');return data})}
function fetchWithTimeout(url,options,timeoutMs){var controller=window.AbortController?new AbortController():null;var timer=setTimeout(function(){if(controller)controller.abort()},timeoutMs||18000);options=options||{};if(controller)options.signal=controller.signal;return fetch(url,options).finally(function(){clearTimeout(timer)}).catch(function(error){if(error&&error.name==='AbortError')throw new Error('XC Progression Board is taking too long to load. Tap Refresh to try again.');throw error})}
function applyBoardData(data,cached){allRows=data.rows||[];filters=data.filters||{};options=data.filterOptions||{};settings=data.gameSettings||{};setLogo(data.logoUrl);els.boardTitle.textContent=boardTitle(data.schoolName||settings.boardName);els.subtitle.textContent='SMART Trak XC Progression Board · '+(filters.label||'Cross Country progression');els.lastUpdated.textContent=(cached?'Last good update ':'Last updated ')+new Date(data.generatedAt||Date.now()).toLocaleString();renderFilterOptions(options,currentFilterValues());render()}
function setLogo(value){var src=String(value||'').trim()||'/assets/smart-logo.png';if(els.logo.getAttribute('src')!==src)els.logo.src=src}
function restoreCachedBoard(){var cached=readCachedBoard();if(!hasBoardRows(cached))return false;applyBoardData(cached,true);return true}
function loadBoard(){if(!token()){setError('XC Progression Board link is missing its access token.');return Promise.resolve()}var restored=restoreCachedBoard();if(!restored)els.lastUpdated.textContent='Loading...';return fetchWithTimeout(apiUrl(),{cache:'no-store'},restored?9000:18000).then(jsonResult).then(function(data){if(!hasBoardRows(data)&&restoreCachedBoard())return;applyBoardData(data,false);writeCachedBoard(data)}).catch(function(error){if(restoreCachedBoard())return;setError(error.message||'XC Progression Board could not load.')})}
function boardTitle(value){var text=String(value||'').trim();return text&&text.toLowerCase()!=='team results board'?text:'SMART Trak'}
function currentFilterValues(){var p=compactShareParams();return{meets:p.getAll('meet').filter(function(value){return String(value||'').trim()&&value!=='__all__'}),event:p.get('event')||'',gender:p.get('gender')||'',grade:p.get('grade')||'',q:p.get('q')||''}}
function renderFilterOptions(opts,current){opts=opts||{};current=current||{};var meets=(opts.meets||[]).slice();(current.meets||[]).forEach(function(value){if(meets.indexOf(value)<0)meets.unshift(value)});var events=(opts.events||[]).slice();if(current.event&&events.indexOf(current.event)<0)events.unshift(current.event);var grades=(opts.grades||[]).slice();if(current.grade&&grades.indexOf(current.grade)<0)grades.unshift(current.grade);selectedMeetNames=(current.meets||[]).slice();els.meetPickerPanel.innerHTML=meetOptionHtml('__all__','All Meets',!selectedMeetNames.length)+meets.map(function(value){return meetOptionHtml(value,value,selectedMeetNames.indexOf(value)>=0)}).join('');updateMeetPickerLabel();els.eventSelect.innerHTML=optionHtml('','All distances')+events.map(function(value){return optionHtml(value,value)}).join('');els.genderSelect.innerHTML=optionHtml('','All genders')+optionHtml('boy','Boys')+optionHtml('girl','Girls');els.gradeSelect.innerHTML=optionHtml('','All grades')+grades.map(function(value){return optionHtml(value,'Grade '+value)}).join('');els.search.value=current.q||'';els.eventSelect.value=current.event||'';els.genderSelect.value=current.gender||'';els.gradeSelect.value=current.grade||''}
function optionHtml(value,label){return'<option value="'+esc(value)+'">'+esc(label||value)+'</option>'}
function meetOptionHtml(value,label,checked){return'<label><input type="checkbox" value="'+esc(value)+'" '+(checked?'checked':'')+'> <span>'+esc(label)+'</span></label>'}
function updateMeetPickerLabel(){els.meetPickerBtn.textContent=selectedMeetNames.length?selectedMeetNames.length+' meet'+(selectedMeetNames.length===1?'':'s')+' selected':'All Meets'}
function viewParams(){var p=compactShareParams();p.delete('k');p.set('account',accountKey());p.set('token',token());p.delete('meet');if(selectedMeetNames.length)selectedMeetNames.forEach(function(name){p.append('meet',name)});else p.set('meet','__all__');setParam(p,'event',els.eventSelect.value);setParam(p,'gender',els.genderSelect.value);setParam(p,'grade',els.gradeSelect.value);setParam(p,'q',els.search.value);return p}
function reloadWithFilters(){var p=viewParams();history.replaceState(null,'',location.pathname+'?'+p.toString());render()}
function copyTextToClipboard(text){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text).then(function(){return true}).catch(function(){return false});return Promise.resolve(false)}
function shareCurrentView(){var url=location.origin+location.pathname+'?'+viewParams().toString();return copyTextToClipboard(url).then(function(copied){els.shareStatus.textContent=copied?'View link copied.':'Copy blocked. Use the address bar link.';setTimeout(function(){els.shareStatus.textContent=''},3500)})}
function setParam(p,key,value){value=String(value||'').trim();if(value)p.set(key,value);else p.delete(key)}
function renderTotals(rows){rows=rows||[];var athletes={};var meets={};var best=0;rows.forEach(function(row){if(row.athleteName)athletes[row.athleteName]=true;if(row.meetName)meets[raceKey(row)]=true;if(row.isPr||row.isSeasonBest)best+=1});els.resultCount.textContent=rows.length;els.athleteCount.textContent=Object.keys(athletes).length;els.meetCount.textContent=Object.keys(meets).length;els.bestCount.textContent=best}
function genderLabel(value){if(value==='boy')return'Boys';if(value==='girl')return'Girls';return'Open'}
function distanceGroupLabel(value){var text=String(value||'').toLowerCase();if(/\b5\s*k\b|5000\s*m|3\.1\s*(mi|mile)/.test(text))return'5K';if(/3200\s*m|2\s*(mi|mile)/.test(text))return'2 Mile / 3200m';return String(value||'Unlisted Distance')}
function gradeTitle(value,seasonYear){var grade=String(value||'').match(/\d+/);if(!grade)return'Ungraded';var n=Number(grade[0]);if(n>20){var year=Number(seasonYear)||new Date().getFullYear();n=13-(n-year)}if(n<1||n>12)return'Ungraded';var suffix=n%100>=11&&n%100<=13?'th':n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th';return n+suffix+' Grade'}
function sectionKey(row){return[distanceGroupLabel(row.event),genderLabel(row.athleteGender)].join(' | ')}
function athleteKey(row){return String(row.athleteName||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function raceKey(row){return[String(row.meetName||''),String(row.seasonYear||''),distanceGroupLabel(row.event),genderLabel(row.athleteGender)].join('|')}
function meetDate(row){return String(row.meetDate||'')}
function formatDate(value){if(!value)return'';var d=new Date(String(value).slice(0,10)+'T12:00:00');if(Number.isNaN(d.getTime()))return String(value);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function parseTimeToMs(value){var parts=String(value||'').trim().split(':').map(Number);if(!parts.length||parts.some(function(part){return isNaN(part)}))return 0;var seconds=parts.length===3?parts[0]*3600+parts[1]*60+parts[2]:parts.length===2?parts[0]*60+parts[1]:parts[0];return Math.round(seconds*1000)}
function formatDelta(ms){var tenths=Math.round(Math.abs(ms)/100);var min=Math.floor(tenths/600);var sec=Math.floor((tenths%600)/10);var dec=tenths%10;return min+':'+String(sec).padStart(2,'0')+(dec?'.'+dec:'')}
function timeChange(current,previous){var a=parseTimeToMs(current);var b=parseTimeToMs(previous);if(!a||!b)return'';var delta=a-b;if(!delta)return'0:00';return(delta<0?'-':'+')+formatDelta(delta)}
function changeClass(value){if(String(value||'').charAt(0)==='-')return'good';if(String(value||'').charAt(0)==='+')return'warn';return'neutral'}
function bestText(row){var out=[];if(row&&row.isPr)out.push('PB');if(row&&row.isSeasonBest)out.push('SB');return out.join(' / ')}
function parseSplits(text){var raw=String(text||'').trim();if(!raw)return[];if(raw.charAt(0)==='['){try{var parsed=JSON.parse(raw);if(Array.isArray(parsed))return parsed.map(function(split){return String(split&&(split.time||split.split)||'').trim();}).filter(Boolean)}catch(e){}}return raw.split(/\r?\n|[;,]+/).map(function(line){var text=String(line||'').trim();var match=text.match(/^\s*(?:(?:Lap|Rep|Rest|Recovery|Split)\s*)?\d+\s*:\s*(.+?)\s*$/i)||text.match(/^\s*[^:]+:\s*((?:\d+:)?\d{1,2}:\d{2}(?:\.\d+)?)\s*$/);return(match?match[1]:text).trim()}).filter(Boolean)}
function betterRaceRow(next,current){if(!current)return next;var nextSplits=parseSplits(next&&next.splitsText).length;var currentSplits=parseSplits(current&&current.splitsText).length;if(nextSplits!==currentSplits)return nextSplits>currentSplits?next:current;var nextTime=parseTimeToMs(next&&next.resultDisplay);var currentTime=parseTimeToMs(current&&current.resultDisplay);if(nextTime!==currentTime)return nextTime?next:current;return String(next&&next.syncedAt||next&&next.meetDate||'')>=String(current&&current.syncedAt||current&&current.meetDate||'')?next:current}
function rowGradeValue(row){var label=gradeTitle(row&&row.grade,row&&row.seasonYear);var match=label.match(/^(\d+)/);return match?match[1]:''}
function filteredRows(){var q=els.search.value.trim().toLowerCase();var event=els.eventSelect.value;var gender=els.genderSelect.value;var grade=els.gradeSelect.value;return allRows.filter(function(row){if(selectedMeetNames.length&&selectedMeetNames.indexOf(row.meetName)<0)return false;if(event&&row.event!==event)return false;if(gender&&row.athleteGender!==gender)return false;if(grade&&rowGradeValue(row)!==grade)return false;return!q||[row.athleteName,row.grade,row.meetName,row.event,genderLabel(row.athleteGender),row.resultDisplay,bestText(row)].join(' ').toLowerCase().indexOf(q)>=0})}
function render(){var rows=filteredRows();renderTotals(rows);els.gridStatus.textContent=rows.length+' result'+(rows.length===1?'':'s');if(!rows.length){els.gridWrap.innerHTML='<div class="empty">No XC progression results match this view.</div>';return}var sections={};rows.forEach(function(row){var key=sectionKey(row);if(!sections[key])sections[key]={title:distanceGroupLabel(row.event)+' '+genderLabel(row.athleteGender),races:{},athletes:{},matrix:{},maxSplits:0};var section=sections[key];var rk=raceKey(row);if(!section.races[rk])section.races[rk]={key:rk,name:row.meetName||'Unlisted meet',date:row.meetDate||''};else if(row.meetDate&&(!section.races[rk].date||String(row.meetDate)<String(section.races[rk].date)))section.races[rk].date=row.meetDate;var ak=athleteKey(row);if(!ak)return;if(!section.athletes[ak])section.athletes[ak]={key:ak,name:row.athleteName,grade:row.grade||''};section.matrix[ak]=section.matrix[ak]||{};section.matrix[ak][rk]=betterRaceRow(row,section.matrix[ak][rk]);section.maxSplits=Math.max(section.maxSplits,parseSplits(section.matrix[ak][rk].splitsText).length)});var html='<table class="progression">';Object.keys(sections).sort().forEach(function(key){var section=sections[key];var races=Object.keys(section.races).map(function(k){return section.races[k]}).sort(function(a,b){return String(a.date).localeCompare(String(b.date))||String(a.name).localeCompare(String(b.name))});var athletes=Object.keys(section.athletes).map(function(k){return section.athletes[k]}).sort(function(a,b){return a.name.localeCompare(b.name)});var splitCount=Math.max(1,section.maxSplits);var width=splitCount+1+Math.max(1,splitCount-1);html+='<tr><th>'+esc(section.title)+'</th>';races.forEach(function(race,index){html+='<th class="racehead '+(index%2?'alt':'')+'" colspan="'+width+'">'+esc(race.name)+'</th>'});html+='</tr><tr><th>Athlete</th>';races.forEach(function(){for(var s=0;s<splitCount;s+=1)html+='<th>Mile '+(s+1)+'</th>';html+='<th>Total</th>';for(var c=1;c<splitCount;c+=1)html+='<th>split</th>';if(splitCount===1)html+='<th>split</th>'});html+='</tr>';athletes.forEach(function(athlete){html+='<tr><td class="name">'+esc(athlete.name)+'</td>';races.forEach(function(race){var row=section.matrix[athlete.key]&&section.matrix[athlete.key][race.key];var splits=row?parseSplits(row.splitsText):[];if(!row){for(var d=0;d<width;d+=1)html+='<td class="dnr">DNR</td>';return}for(var i=0;i<splitCount;i+=1)html+='<td>'+esc(splits[i]||'')+'</td>';html+='<td class="final">'+esc(row.resultDisplay||'')+'</td>';for(var j=1;j<splitCount;j+=1){var splitChange=splits[j]&&splits[j-1]?timeChange(splits[j],splits[j-1]):'';html+='<td class="'+changeClass(splitChange)+'">'+esc(splitChange)+'</td>'}if(splitCount===1)html+='<td class="neutral"></td>'});html+='</tr>'})});html+='</table>';els.gridWrap.innerHTML=html}
function setError(message){els.lastUpdated.textContent='Load failed';els.gridStatus.textContent=message;els.gridWrap.innerHTML='<div class="empty">'+esc(message)+'</div>'}
els.refreshBtn.addEventListener('click',loadBoard);els.shareViewBtn.addEventListener('click',shareCurrentView);els.search.addEventListener('input',function(){reloadWithFilters()});els.meetPickerBtn.addEventListener('click',function(){var open=els.meetPickerPanel.hidden;els.meetPickerPanel.hidden=!open;els.meetPickerBtn.setAttribute('aria-expanded',open?'true':'false')});els.meetPickerPanel.addEventListener('change',function(event){var input=event.target;if(!input||input.type!=='checkbox')return;if(input.value==='__all__'&&input.checked){selectedMeetNames=[];Array.prototype.forEach.call(els.meetPickerPanel.querySelectorAll('input[type="checkbox"]'),function(box){box.checked=box.value==='__all__'});}else{var checked=Array.prototype.slice.call(els.meetPickerPanel.querySelectorAll('input[type="checkbox"]:checked')).map(function(box){return box.value}).filter(function(value){return value!=='__all__'});selectedMeetNames=checked;var allBox=els.meetPickerPanel.querySelector('input[value="__all__"]');if(allBox)allBox.checked=!selectedMeetNames.length;}updateMeetPickerLabel();reloadWithFilters()});document.addEventListener('click',function(event){if(els.meetPickerPanel.hidden)return;if(!els.meetPickerPanel.contains(event.target)&&event.target!==els.meetPickerBtn){els.meetPickerPanel.hidden=true;els.meetPickerBtn.setAttribute('aria-expanded','false')}});[els.eventSelect,els.genderSelect,els.gradeSelect].forEach(function(el){el.addEventListener('change',reloadWithFilters)});els.clearBtn.addEventListener('click',function(){els.search.value='';selectedMeetNames=[];Array.prototype.forEach.call(els.meetPickerPanel.querySelectorAll('input[type="checkbox"]'),function(box){box.checked=box.value==='__all__'});updateMeetPickerLabel();els.eventSelect.value='';els.genderSelect.value='';els.gradeSelect.value='';reloadWithFilters()});loadBoard();
</script>
</body>
</html>
