<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMART Trak XC Top 20</title>
<style>
:root{--blue:#2B4FCC;--ink:#111827;--muted:#64748b;--line:#dbe3ef;--bg:#eef3f9;--white:#fff;--good:#0a7a44;--warn:#b45309}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.page{max-width:1180px;margin:0 auto;padding:24px 16px 36px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;box-shadow:0 12px 28px rgba(15,23,42,.10)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:60px;height:60px;display:grid;place-items:center;flex:0 0 60px}
.mark img{display:block;max-width:60px;max-height:60px;object-fit:contain}
h1{font-size:25px;line-height:1.15;margin:0}
.sub{font-size:14px;color:var(--muted);margin-top:4px}
.updated{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;color:#334155;font-size:13px;font-weight:800;padding:7px 10px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);border-radius:8px;background:#eef2f7;color:#172033;font-family:inherit;font-size:14px;font-weight:900;padding:8px 11px;cursor:pointer}
button.active{background:var(--blue);border-color:var(--blue);color:#fff}
.summary{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;color:var(--muted);font-size:13px;font-weight:800}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900;background:#e8eefc;color:#173891}
.pill.good{background:#dcfce7;color:var(--good)}
.pill.warn{background:#ffedd5;color:var(--warn)}
.tablewrap{background:#fff;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px;table-layout:fixed}
th,td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;text-transform:uppercase;color:#475569;background:#f8fafc;letter-spacing:.03em}
th:nth-child(1){width:58px}
th:nth-child(3),th:nth-child(6){width:76px}
th:nth-child(4){width:118px}
td{overflow-wrap:anywhere}
tr.active-athlete td{background:#f0fdf4}
tr.current-year td{background:#fff7ed}
tr.active-athlete.current-year td{background:#f0f9ff}
.name{font-weight:900;color:#102a70}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.empty,.error{padding:28px;text-align:center;color:var(--muted);font-size:15px;font-weight:800}
.error{color:#b91c1c}
@media(max-width:760px){
  .top,.panelhead{align-items:flex-start;flex-direction:column}
  .updated{align-self:flex-start}
}
</style>
</head>
<body>
<main class="page">
  <section class="top">
    <div class="brand">
      <div class="mark"><img data-brand-logo src="/assets/smart-logo.png" alt="SMART Trak"></div>
      <div>
        <h1>SMART Trak XC Top 20</h1>
        <div class="sub">Cross country top lists shared by the team.</div>
      </div>
    </div>
    <div id="updated" class="updated">Loading...</div>
  </section>

  <section class="panel">
    <div class="panelhead">
      <div class="tabs">
        <button class="tab active" data-list="boys5k" type="button">Boys 5K</button>
        <button class="tab" data-list="girls5k" type="button">Girls 5K</button>
        <button class="tab" data-list="girls2Mile" type="button">Girls 2 Mile</button>
      </div>
      <div id="status" class="sub">Loading XC records...</div>
    </div>
    <div id="summary" class="summary"></div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Athlete</th>
            <th>Grade</th>
            <th>Time</th>
            <th>Meet / Course</th>
            <th>Year</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>No XC marks in this list yet.</div>
      <div id="error" class="error" hidden></div>
    </div>
  </section>
</main>
<script>
var activeList='boys5k';
var DEFAULT_LIST_KEYS=['boys5k','girls5k','girls2Mile'];
var data={listOptions:[],lists:{boys5k:[],girls5k:[],girls2Mile:[]},totals:{}};
var els={
  updated:document.getElementById('updated'),
  status:document.getElementById('status'),
  summary:document.getElementById('summary'),
  rows:document.getElementById('rows'),
  empty:document.getElementById('empty'),
  error:document.getElementById('error')
};
function esc(value){
  return String(value==null?'':value).replace(/[&<>"']/g,function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}
function listLabel(key){
  var option=(data.listOptions||[]).find(function(item){return item&&item.key===key;});
  return option&&option.label||{boys5k:'Boys 5K',girls5k:'Girls 5K',girls2Mile:'Girls 2 Mile'}[key]||'Boys 5K';
}
function visibleListKeys(){
  var lists=data&&data.lists||{};
  var keys=DEFAULT_LIST_KEYS.slice();
  (data.listOptions||[]).forEach(function(item){
    var key=item&&item.key;
    if(key&&keys.indexOf(key)<0&&(lists[key]||[]).length)keys.push(key);
  });
  return keys;
}
function paramsFromShareKey(){
  var params=new URLSearchParams(window.location.search);
  var key=params.get('k')||'';
  if(!key)return params;
  try{
    key=String(key).trim().replace(/-/g,'+').replace(/_/g,'/');
    while(key.length%4)key+='=';
    var raw=JSON.parse(atob(key));
    if(raw.a&&!params.get('account'))params.set('account',raw.a);
    if(raw.t&&!params.get('token'))params.set('token',raw.t);
  }catch(error){}
  return params;
}
function render(){
  var lists=data&&data.lists||{};
  var visible=visibleListKeys();
  if(visible.indexOf(activeList)<0)activeList=visible[0]||'boys5k';
  var rows=lists[activeList]||[];
  var totals=data&&data.totals||{};
  document.querySelector('.tabs').innerHTML=visible.map(function(key){
    return '<button class="tab'+(key===activeList?' active':'')+'" data-list="'+esc(key)+'" type="button">'+esc(listLabel(key))+'</button>';
  }).join('');
  els.summary.innerHTML=visible.map(function(key){
    return '<span class="pill">'+esc(listLabel(key))+': '+esc(totals[key]||0)+'</span>';
  }).join('');
  document.querySelectorAll('.tab[data-list]').forEach(function(button){
    button.classList.toggle('active',button.getAttribute('data-list')===activeList);
  });
  els.rows.innerHTML=rows.map(function(row){
    var classes=[];
    if(row.activeAthlete)classes.push('active-athlete');
    if(row.currentYear)classes.push('current-year');
    var badges=[];
    if(row.activeAthlete)badges.push('<span class="pill good">Active</span>');
    if(row.currentYear)badges.push('<span class="pill warn">Current year</span>');
    return '<tr'+(classes.length?' class="'+classes.join(' ')+'"':'')+'>'+
      '<td><b>'+esc(row.rank)+'</b></td>'+
      '<td><div class="name">'+esc(row.athleteName||'Unlisted athlete')+'</div>'+(badges.length?'<div class="badges">'+badges.join('')+'</div>':'')+'</td>'+
      '<td>'+esc(row.grade||'')+'</td>'+
      '<td><b>'+esc(row.resultDisplay||'')+'</b></td>'+
      '<td>'+esc(row.meetName||'')+'</td>'+
      '<td>'+esc(row.seasonYear||'')+'</td>'+
    '</tr>';
  }).join('');
  els.empty.hidden=!!rows.length;
  els.status.textContent=rows.length+' mark'+(rows.length===1?'':'s')+' in '+listLabel(activeList);
}
function load(){
  var params=paramsFromShareKey();
  return fetch('/api/smart-trak/xc-records-board?'+params.toString(),{cache:'no-store'}).then(function(res){
    return res.json().then(function(json){return{ok:res.ok,data:json};});
  }).then(function(result){
    if(!result.ok)throw new Error(result.data&&result.data.error||'XC Top 20 could not be loaded.');
    data=result.data&&result.data.xcTop20||data;
    var stamp=result.data&&result.data.generatedAt?new Date(result.data.generatedAt):new Date();
    els.updated.textContent='Updated '+stamp.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    render();
  }).catch(function(error){
    els.rows.innerHTML='';
    els.summary.innerHTML='';
    els.empty.hidden=true;
    els.error.hidden=false;
    els.error.textContent=error.message||'XC Top 20 could not be loaded.';
    els.status.textContent='Unable to load';
    els.updated.textContent='Not available';
  });
}
document.querySelector('.tabs').addEventListener('click',function(event){
  var button=event.target.closest&&event.target.closest('[data-list]');
  if(!button)return;
  activeList=button.getAttribute('data-list')||'boys5k';
  render();
});
load();
</script>
</body>
</html>
